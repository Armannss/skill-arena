<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="felt" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" stitchTiles="stitch" result="cloud"/>
    <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 0.44  0 0 0 0 0.37  0 0 0 0 0.31  0 0 0 0.14 0" result="cloudTone"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5" stitchTiles="stitch" result="grain"/>
    <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.34  0 0 0 0 0.29  0 0 0 0.1 0" result="grainTone"/>
    <feMerge><feMergeNode in="cloudTone"/><feMergeNode in="grainTone"/></feMerge>
  </filter>
  <rect width="360" height="360" filter="url(#felt)"/>
</svg>
